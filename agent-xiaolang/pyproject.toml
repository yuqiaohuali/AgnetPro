[project]
name = "agent-xiaolang"
version = "0.1.0"
description = "单智能体案例"
authors = [
    { name = "songjianping" }
]
requires-python = ">=3.13,<4.0"
dependencies = ["langchain (>=1.4.7,<2.0.0)", "redis (>=8.1.0,<9.0.0)", "qdrant-client (>=1.20.0,<2.0.0)", "langchain-qdrant (>=1.1.0,<2.0.0)", "python-dotenv (>=1.1.1,<2.0.0)", "langchain-deepseek (>=1.1.1,<2.0.0)", "langchain-openai (>=1.7.2,<2.0.0)", "dingtalk-stream (>=0.24.3,<0.25.0)", "langchain-text-splitters (>=1.1.3,<2.0.0)", "python-docx (>=1.2.0,<2.0.0)", "openpyxl (>=3.1.5,<4.0.0)", "pypdf (>=6.21.2,<7.0.0)", "charset-normalizer (>=3.5.2,<4.0.0)"]

# 指定当前项目的 Python 包
[tool.poetry]
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
